services:
  backend:
    container_name: mongoshop_app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
     - .env.local
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/shopmart
      - PORT=8000
    depends_on:
      - mongodb
    networks:
      - mongoshop
    restart: unless-stopped

  mongodb:
    container_name: mongodb
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - mongoshop
    volumes:
      - mongoshop:/data/db
    environment:
      - MONGO_INITDB_DATABASE=shopmart
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped


networks:
  mongoshop:
    driver: bridge

volumes:
  mongoshop:
    driver: local
