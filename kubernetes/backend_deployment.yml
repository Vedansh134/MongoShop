kind: Deployment
apiVersion: apps/v1
metadata:
  name: backend-deployment
  namespace: mongoshop-backend
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kvedansh/mongoshop-backend-img:latest
          ports:
            - containerPort: 8000
          env:
          - name: PORT
            value: "8000"
          - name: MONGODB_URI
            # value: "mongodb://mongodb:27017/shopmart"
            value: "mongodb://mongodb-svc.mongoshop-database.svc.cluster.local:27017/shopmart"
            # value: "mongodb://admin:password123@mongodb-service.mongoshop-database.svc.cluster.local:27017/shopmart?authSource=admin"   
          # Add resource limits
          resources: 
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

