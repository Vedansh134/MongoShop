kind: Deployment # StatefulSet # later use
apiVersion: apps/v1
metadata:
  name: mongo-deployment
  namespace: mongoshop-database
  labels:
    app: mongo
spec:
  # serviceName: mongodb-svc # for stateful only
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:latest
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Pull credentials from secret
          env:
          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: mongodb-secret
                key: mongodb-username
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongodb-secret
                key: mongodb-password
          - name: MONGO_INITDB_DATABASE
            valueFrom:
              secretKeyRef:
                name: mongodb-secret
                key: mongodb-database
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
