kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: mongo-statefulset
  namespace: mongoshop-database
  labels:
    app: mongo
spec:
  serviceName: mongodb-svc # for stateful only
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Simple MongoDB configuration (no replica set)
          command:
          - mongod
          - "--bind_ip_all"
          - "--auth"
          # Pull credentials from secret
          env:
          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: mongodb-secret
                key: mongodb-username
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongodb-secret
                key: mongodb-password
          - name: MONGO_INITDB_DATABASE
            value: "admin"

  volumeClaimTemplates:
  - metadata:
      name: mongo-storage
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: "Standard" # use minikube standard ip
      resources:
        requests:
          storage: 5Gi
